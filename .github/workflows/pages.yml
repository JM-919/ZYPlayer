# 网页版自动构建 / 发布
#
#   push 到 main 之后自动:
#     ① node web/build-web.mjs  → 把 Android 工程里的界面组装成 web/dist
#     ② node web/deploy-worker.mjs → 把 web/dist 当**静态资源**塞进 Cloudflare Worker,
#        Worker 同时提供站点与 /f /p 代理 —— 这是实际在用的线(https://zyplayer.hof12.ccwu.cc/)
#     ③ 把 web/dist 传成 artifact(zyplayer-web), 手动部署可直接下载
#     ④ 若仓库开了 Pages 就顺手也发一份到 https://<owner>.github.io/<repo>/ (备用)
#
# 第 ② 步需要仓库配置(没配就自动跳过, 构建仍绿):
#   Secrets   : CF_API_TOKEN          (Cloudflare token: Workers Scripts:Edit)
#   Variables : CF_ACCOUNT_ID, CF_ZONE_ID, CF_WORKER_NAME(如 cool-sea-dfd8), CF_DOMAIN(如 zyplayer.hof12.ccwu.cc)
#
# 关于第 ④ 步: 仓库还没开 Pages 时 GITHUB_TOKEN 无权「创建」Pages 站点
#   (报 Resource not accessible by integration)。Settings → Pages → Source 选
#   "GitHub Actions" 保存一次即可; 不用就设变量 ENABLE_GH_PAGES=false。
name: pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_DOMAIN: ${{ vars.CF_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 环境信息(排查失败时先看这里)
        run: |
          node -v
          echo "提交: $GITHUB_SHA"
          echo "CF 变量: token=$([ -n "$CF_API_TOKEN" ] && echo 有 || echo 无) account=$([ -n "$CF_ACCOUNT_ID" ] && echo 有 || echo 无) zone=$([ -n "$CF_ZONE_ID" ] && echo 有 || echo 无) worker=${CF_WORKER_NAME:-cool-sea-dfd8} domain=${CF_DOMAIN:-未设置}"
      - name: 播放链路自测(桥/Service Worker 的代理不变量)
        run: node web/selftest.mjs
      - name: 组装网页版(把界面源码搬到 web/dist)
        run: node web/build-web.mjs
      # 这一步失败**默认不让整个构建变红**: 它最常见的失败原因是仓库里的 CF_API_TOKEN 过期/
      # 权限不够(Workers Scripts:Edit), 而构建产物本身是好的 —— 构建变红会让人以为"代码坏了"。
      # 想让它变成硬门(部署失败就失败)就去仓库变量里设 REQUIRE_CF_DEPLOY=true。
      - name: 部署到 Cloudflare Worker(站点 + 代理)
        id: cfdeploy
        continue-on-error: ${{ vars.REQUIRE_CF_DEPLOY != 'true' }}
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: |
          set -o pipefail
          if [ -n "$CF_DOMAIN" ]; then
            node web/deploy-worker.mjs --domain "$CF_DOMAIN" || { code=$?; echo "::warning::CF 部署失败(exit $code): 检查 CF_API_TOKEN 是否过期/有 Workers Scripts:Edit 权限, 以及 CF_ACCOUNT_ID/CF_ZONE_ID 是否正确"; exit $code; }
          else
            node web/deploy-worker.mjs || { code=$?; echo "::warning::CF 部署失败(exit $code): 同上; 另外没设 CF_DOMAIN 时不会绑定自定义域"; exit $code; }
          fi
      - name: 打包 web/dist(手动部署可直接下载)
        uses: actions/upload-artifact@v4
        with:
          name: zyplayer-web
          path: web/dist
      # 备用通道: 仓库没开 Pages 时这一步也可能报错, 同样不该把构建染红
      - name: 上传 GitHub Pages 工件(备用通道)
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    # GitHub Pages 是**备用**通道(线上用的是 Cloudflare Worker)。
    # 以前是"默认就试", 仓库没开 Pages 时这个 job 会红一下, 看着像构建坏了 —— 现在改成
    # 要显式打开: 仓库变量 ENABLE_GH_PAGES=true 才跑(开了 Pages 再设它)。
    if: vars.ENABLE_GH_PAGES == 'true'
    # 站点还没开时这里会失败, 但不该让整个构建变红(构建/artifact 才是主产物)
    continue-on-error: true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
